<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парковка для электромобилей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fc;
            min-height: 100vh;
            padding: 0;
            color: #1a1a1a;
        }
        
        .header-top {
            background: white;
            padding: 16px 40px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-top .logo {
            font-weight: 700;
            font-size: 20px;
            color: #1b5fd8;
            display: flex;
            align-items: center;
        }
        
        .header-top .logo img {
            height: 32px;
            width: auto;
        }
        
        .header-top nav {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }
        
        .header-top nav a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .header-top nav a:hover {
            color: #1b5fd8;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
        }
        
        .header {
            background: white;
            color: #1a1a1a;
            padding: 40px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 14px;
            color: #666;
        }
        
        .main {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            padding: 0;
            align-items: start;
            min-height: calc(100vh - 200px);
        }
        
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
        }
        
        .sidebar {
            background: #f8f9fc;
            border-radius: 0;
            padding: 24px;
            border-right: 1px solid #e5e7eb;
            max-height: none;
            overflow-y: auto;
        }
        
        .sidebar h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        
        .variant-button {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
            font-size: 13px;
            color: #1a1a1a;
        }
        
        .variant-button:hover {
            border-color: #1b5fd8;
            background: #f0f6ff;
        }
        
        .variant-button.active {
            background: #1b5fd8;
            color: white;
            border-color: #1b5fd8;
            font-weight: 600;
        }
        
        .icon {
            margin-right: 6px;
            font-size: 16px;
        }
        
        .info-panel {
            background: white;
            border-radius: 0;
            padding: 40px;
            border: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .info-empty {
            text-align: center;
            color: #999;
            padding: 80px 40px;
            font-style: italic;
            font-size: 14px;
        }
        
        .variant-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px 6px 4px 0;
            border: 1px solid;
        }
        
        .badge-simple {
            background: #f0f9ff;
            border-color: #bfdbfe;
            color: #0369a1;
        }
        
        .badge-medium {
            background: #fefce8;
            border-color: #fcd34d;
            color: #a16207;
        }
        
        .badge-complex {
            background: #fee2e2;
            border-color: #fecaca;
            color: #991b1b;
        }
        
        .badge-forbidden {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        
        .section {
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #1a1a1a;
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 12px;
            display: block;
        }
        
        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }
        
        .param-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .param-label {
            font-weight: 500;
            color: #1a1a1a;
        }
        
        .diagram {
            background: #f8fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin-top: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #666;
            overflow-x: auto;
        }
        
        .compare-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        
        .key-points {
            background: #f8fafb;
            border-left: 3px solid #1b5fd8;
            padding: 16px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.7;
        }
        
        .key-points strong {
            color: #1a1a1a;
        }
        
        .key-points li {
            margin-left: 20px;
            margin-bottom: 8px;
            color: #666;
        }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-button {
            padding: 10px 16px;
            border: 1px solid #e5e7eb;
            background: white;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .tab-button:hover {
            border-color: #1b5fd8;
            color: #1b5fd8;
        }
        
        .tab-button.active {
            background: #1b5fd8;
            color: white;
            border-color: #1b5fd8;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .warning-box {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: 14px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 13px;
            color: #92400e;
            line-height: 1.6;
        }
        
        .success-box {
            background: #d1fae5;
            border-left: 3px solid #10b981;
            padding: 14px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 13px;
            color: #065f46;
            line-height: 1.6;
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 13px;
        }
        
        .comparison-table th {
            background: #f8fafb;
            color: #1a1a1a;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .comparison-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            color: #666;
        }
        
        .comparison-table tr:hover {
            background: #f8fafb;
        }
    </style>
</head>

                title: "8. МЕХАНИЗИРОВАННЫЕ СТОЯНКИ",
                complexity: "forbidden",
                description: "Автоматизированные и полумеханизированные парковки",
                specs: [
                    { label: "Возможность", value: "ЗАПРЕЩЕНО" },
                    { label: "Причина", value: "Высокий пожарный риск" },
                    { label: "Проблема", value: "Невозможно обслуживать при ЧС" },
                    { label: "Альтернатива", value: "Только открытые и закрытые стоянки" }
                ],
                norm: "СП 551 п. 7.3",
                notes: "Электромобили категорически ЗАПРЕЩЕНЫ в механизированных и полумеханизированных стоянках из-за пожарной опасности и невозможности эвакуации при чрезвычайной ситуации.",
                pros: [],
                cons: ["Нет альтернативы", "Запрет абсолютный"]
            }
        ];
        
        // Инициализация
        function init() {
            renderVariants();
            selectVariant(1);
        }
        
        function renderVariants() {
            const sidebar = document.getElementById('sidebar');
            let html = '<h3 style="font-size: 14px; margin-bottom: 16px; color: #333;">📋 Варианты:</h3>';
            
            variants.forEach(v => {
                html += `
                    <button class="variant-button ${v.id === 1 ? 'active' : ''}" onclick="selectVariant(${v.id})">
                        <span class="icon">${v.icon}</span>
                        <div>${v.title.split(',')[0]}</div>
                        <div style="font-size: 12px; color: #999; font-weight: 400; margin-top: 4px;">${v.description}</div>
                    </button>
                `;
            });
            
            sidebar.innerHTML = html;
        }
        
        function selectVariant(id) {
            // Обновляю активные кнопки
            document.querySelectorAll('.variant-button').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === id || (idx === 0 && id === 1));
            });
            
            const variant = variants.find(v => v.id === id);
            if (!variant) return;
            
            // Определяю цвет бейджа
            let badgeClass = 'badge-simple';
            if (variant.complexity === 'complex') badgeClass = 'badge-complex';
            else if (variant.complexity === 'medium') badgeClass = 'badge-medium';
            else if (variant.complexity === 'forbidden') badgeClass = 'badge-forbidden';
            
            let html = `
                <div class="variant-title">${variant.icon} ${variant.title}</div>
                <span class="badge ${badgeClass}">${variant.complexity === 'simple' ? '✓ Простой' : variant.complexity === 'medium' ? '⚠ Средний' : variant.complexity === 'complex' ? '🔴 Сложный' : '🚫 Запрещено'}</span>
                <span class="badge" style="background: #e3f2fd; color: #1565c0;">Норма: ${variant.norm}</span>
                
                <div class="section">
                    <div class="section-label">📋 Параметры</div>
                    <div class="section-content">
                        ${variant.specs.map(s => `
                            <div class="param-row">
                                <div class="param-label">${s.label}</div>
                                <div>${s.value}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-label">📝 Описание</div>
                    <div class="section-content">${variant.notes}</div>
                </div>
                
                ${variant.diagram ? `
                    <div class="section">
                        <div class="section-label">📐 Схема</div>
                        <div class="diagram">${variant.diagram}</div>
                    </div>
                ` : ''}
                
                ${variant.warning ? `
                    <div class="warning-box">
                        ⚠️ <strong>ВАЖНО:</strong> ${variant.warning}
                    </div>
                ` : ''}
                
                ${variant.pros.length > 0 ? `
                    <div class="section">
                        <div class="section-label">✓ Преимущества</div>
                        <ul class="key-points" style="background: #d1fae5; border-left-color: #10b981;">
                            ${variant.pros.map(p => `<li>${p}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
                
                ${variant.cons.length > 0 ? `
                    <div class="section">
                        <div class="section-label">✗ Недостатки</div>
                        <ul class="key-points" style="background: #fee2e2; border-left-color: #ef4444;">
                            ${variant.cons.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;
            
            document.getElementById('infoPanel').innerHTML = html;
        }
        
        // Запуск
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
