<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- План пола парковки -->
  <g transform="translate(50, 50)">
    <!-- Основная панель -->
    <rect x="-25" y="-20" width="50" height="35" fill="#2C79EC" rx="2"/>
    
    <!-- Линии уклонов (уклон пола) -->
    <line x1="-20" y1="-12" x2="20" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="-4" x2="20" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Лоток водоотвода -->
    <path d="M -15 12 L 15 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
